<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - الإدارة</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 30px; color: #2ecc71; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #252525;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2ecc71;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #27ae60; }
        .logo { font-size: 2.5rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🔒</div>
        <h2>لوحة التحكم الخاصة</h2>
        <form method="post">
            <input type="password" name="password" placeholder="أدخل كلمة المرور" required autofocus>
            <button type="submit">دخول الآمن</button>
        </form>
    </div>
</body>
</html>
