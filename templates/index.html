{% extends "base.html" %}
{% block content %}
<div style="display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;">
    <!-- Registration Form -->
    <div style="flex: 1; min-width: 300px; padding: 20px; border: 1px solid #ced6e0; border-radius: 8px;">
        <h3>Register</h3>
        <p style="font-size: 13px; color: #57606f;">Create an account to get your shareable link.</p>
        <form action="/register" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label>Username:</label><br>
                <input type="text" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div>
                <label>Password:</label><br>
                <input type="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <button type="submit" class="btn" style="background-color: #2ed573;">Register</button>
        </form>
    </div>

    <!-- Login Form -->
    <div style="flex: 1; min-width: 300px; padding: 20px; border: 1px solid #ced6e0; border-radius: 8px;">
        <h3>Login</h3>
        <p style="font-size: 13px; color: #57606f;">Access your dashboard and messages.</p>
        <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label>Username:</label><br>
                <input type="text" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div>
                <label>Password:</label><br>
                <input type="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</div>
{% endblock %}
