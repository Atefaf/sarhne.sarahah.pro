<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarhne Admin - Full Insight</title>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>

<div class="top">
    <h1>🕵️ Deep Visitor Insight Dashboard</h1>
    <a href="/">← Visit Site</a>
</div>

<div class="stats">
    <div class="stat-box">
        <div class="num" id="totalLogs">0</div>
        <div class="label">Total Logs</div>
    </div>
    <div class="stat-box">
        <div class="num" id="zeroClickVisits">0</div>
        <div class="label">Zero-Click Visits</div>
    </div>
    <div class="stat-box">
        <div class="num" id="messagesSent">0</div>
        <div class="label">Messages Sent</div>
    </div>
</div>

<div id="visitorsContainer">
    <!-- Visitors will be rendered here -->
</div>

<script type="module" src="/src/admin.js"></script>
</body>
</html>
